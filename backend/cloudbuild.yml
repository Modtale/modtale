steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull gcr.io/$PROJECT_ID/modtale-backend:${_TAG} || true
        if [ "${_TAG}" != "latest" ]; then
          docker pull gcr.io/$PROJECT_ID/modtale-backend:latest || true
        fi
        DOCKER_BUILDKIT=1 docker build \
          --cache-from gcr.io/$PROJECT_ID/modtale-backend:${_TAG} \
          --cache-from gcr.io/$PROJECT_ID/modtale-backend:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t gcr.io/$PROJECT_ID/modtale-backend:${_TAG} \
          .

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/modtale-backend:${_TAG}']

substitutions:
  _TAG: latest

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
