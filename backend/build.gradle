plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'net.modtale'
version = '0.0.1-SNAPSHOT'

// Keep the embedded Tomcat family aligned while Boot 4.1.1 manages 11.0.24.
// 11.0.26 includes the security fixes in 11.0.25 and the latest 11.0.x fixes:
// https://tomcat.apache.org/security-11.html
ext['tomcat.version'] = '11.0.26'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

springBoot {
    mainClass = 'net.modtale.ModtaleApplication'
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.session:spring-session-data-mongodb:4.0.0-M2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'dev.samstevens.totp:totp-spring-boot-starter:1.7.1'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation platform('software.amazon.awssdk:bom:2.54.11')
    implementation 'software.amazon.awssdk:s3'

    implementation 'com.giffing.bucket4j.spring.boot.starter:bucket4j-spring-boot-starter:0.14.0'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260313.1'
    implementation 'net.coobird:thumbnailator:0.4.21'
    implementation 'com.github.usefulness:webp-imageio:0.11.0'

    implementation 'com.github.weisj:jsvg:2.1.0'

    implementation 'org.vineflower:vineflower:1.12.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Mockito's documented Java 21+ setup avoids unsupported dynamic self-attachment.
    // Test-only instrumentation uses the same Spring-managed Mockito version.
    jvmArgumentProviders.add(new CommandLineArgumentProvider() {
        @InputFiles
        @PathSensitive(PathSensitivity.RELATIVE)
        FileCollection agentClasspath = configurations.mockitoAgent

        @Override
        Iterable<String> asArguments() {
            return ["-javaagent:${agentClasspath.singleFile.absolutePath}".toString()]
        }
    })
}

tasks.register('statusServiceJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'Builds the detached Modtale status service jar.'
    archiveClassifier = 'status'
    mainClass = 'net.modtale.status.StatusServiceApplication'
    targetJavaVersion = JavaVersion.VERSION_26
    classpath = sourceSets.main.runtimeClasspath
}
