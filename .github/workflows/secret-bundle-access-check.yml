name: Check Secret Bundle Access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'Modtale/modtale' && github.ref == 'refs/heads/main' &&
      github.actor == 'Villagers654' && github.triggering_actor == 'Villagers654'
    strategy:
      fail-fast: false
      matrix:
        project: [main, pr-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.project == 'pr-preview' && 'pr-preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only check before authentication
        run: python3 -B -m unittest discover -s .github/tests -p 'check_secret_bundle_access_test.py'
      - name: Authenticate main-project identity
        if: matrix.project == 'main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Authenticate dedicated PR identity
        if: matrix.project == 'pr-preview'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PREVIEW_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check fixed permissions and filtered log view
        env:
          BUNDLE_ACCESS_PROJECT: ${{ matrix.project }}
        run: python3 .github/scripts/check_secret_bundle_access.py
