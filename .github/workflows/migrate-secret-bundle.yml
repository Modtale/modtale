name: Prepare Secret Bundle
on:
  workflow_dispatch:
    inputs:
      boundary:
        type: choice
        required: true
        options: [shared, branch-preview, pr-preview]
      confirmation:
        description: Type PUBLISH_BUNDLE to copy pinned source versions into the fixed destination. This does not deploy or delete.
        type: string
        required: true
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.repository == 'Modtale/modtale' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.actor == 'Villagers654' &&
      github.triggering_actor == 'Villagers654' &&
      inputs.confirmation == 'PUBLISH_BUNDLE' &&
      contains(fromJSON('["shared","branch-preview","pr-preview"]'), inputs.boundary) &&
      (inputs.boundary == 'shared' ||
      vars.SECRET_BUNDLE_PREVIEW_WRITERS_READY == 'true')
    runs-on: ubuntu-latest
    environment: ${{ inputs.boundary == 'pr-preview' && 'pr-preview' || 'production' }}
    concurrency:
      group: modtale-secret-bundle-mutations-v1
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate migration tooling with synthetic data
        run: python3 -B -m unittest discover -s .github/tests -p '*bundle*test.py'
      - name: Authenticate main-project migration
        if: inputs.boundary != 'pr-preview'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Authenticate dedicated preview migration
        if: inputs.boundary == 'pr-preview'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PREVIEW_CREDENTIALS }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publish fixed destination without deploying
        env:
          BUNDLE_PREVIEW_WRITERS_READY: ${{ vars.SECRET_BUNDLE_PREVIEW_WRITERS_READY || 'false' }}
          BUNDLE_BOUNDARY: ${{ inputs.boundary }}
          BUNDLE_MIGRATION_CONFIRM: ${{ inputs.confirmation }}
        run: python3 .github/scripts/migrate_secret_bundle.py
