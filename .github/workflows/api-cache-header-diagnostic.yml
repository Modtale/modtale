name: API Cache Header Diagnostic

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fixed API environment; production is for approved post-rule verification
        type: choice
        options: [dev, production]
        default: dev
        required: true

permissions:
  contents: read

concurrency:
  group: modtale-api-cache-header-diagnostic-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'Modtale/modtale' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_DIAGNOSTIC_TARGET: ${{ inputs.target }}
    steps:
      - name: Check out diagnostic
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Validate fixed environment and unit guards
        run: |
          node .github/scripts/api-cache-header-diagnostic.mjs validate
          node --test .github/tests/api-cache-header-diagnostic.test.mjs
      - name: Read bounded ordinary API headers
        run: node .github/scripts/api-cache-header-diagnostic.mjs
      - name: Preserve redacted observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-cache-headers-${{ inputs.target }}-${{ github.run_id }}
          path: api-cache-diagnostic-output/
          retention-days: 7
          if-no-files-found: warn
