name: Launcher validation

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-validation.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            26
          check-latest: true
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libopengl0 libegl1 libpango-1.0-0 libasound2t64 \
            libudev1 libwayland-client0 libwayland-egl1
          sudo apt-get install -y weston libgl1-mesa-dri binutils
      - name: Test and build the native application image
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Run Linux validation without an X server.
            export XDG_RUNTIME_DIR
            XDG_RUNTIME_DIR=$(mktemp -d)
            export WAYLAND_DISPLAY=modtale-validation
            weston --backend=headless-backend.so --renderer=pixman --socket="$WAYLAND_DISPLAY" --idle-time=0 \
              --width=1600 --height=1000 --no-config > "$XDG_RUNTIME_DIR/weston.log" 2>&1 &
            weston_pid=$!
            trap 'kill "$weston_pid" 2>/dev/null || true; cat "$XDG_RUNTIME_DIR/weston.log"; rm -rf "$XDG_RUNTIME_DIR"' EXIT
            for attempt in {1..100}; do
              if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
              kill -0 "$weston_pid"
              sleep 0.1
            done
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            env -u DISPLAY GDK_BACKEND=wayland ./gradlew test testBootstrap jpackageAppImage
          else
            ./gradlew test testBootstrap jpackageAppImage
          fi
      - name: Validate packaged runtime setup and offline reuse
        run: |
          case "$RUNNER_OS" in
            Windows) launcher="build/jpackage/app-image/Modtale Launcher/Modtale Launcher.exe" ;;
            macOS) launcher="build/jpackage/app-image/Modtale Launcher.app/Contents/MacOS/Modtale Launcher" ;;
            Linux) launcher="build/jpackage/app-image/Modtale Launcher/bin/Modtale Launcher" ;;
          esac
          python bootstrap/smoke.py "$launcher" "$JAVA_HOME"
          python bootstrap/smoke.py "$launcher" "$JAVA_HOME" --hytale
          python bootstrap/smoke.py "$launcher"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: launcher-validation-${{ runner.os }}
          path: |
            launcher/build/reports/tests
            launcher/build/test-results
            launcher/build/reports/package-size.json
