<svg width="1440" height="820" viewBox="0 0 1440 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Modtale feature showcase</title>
  <desc id="desc">Animated interface graphic showing Modtale browse filters, project cards, analytics, API docs, and RSS sharing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#122322"/>
    </linearGradient>
    <linearGradient id="surface" x1="230" y1="110" x2="1210" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .float-a { animation: floatA 6s ease-in-out infinite; }
      .float-b { animation: floatB 7s ease-in-out infinite; }
      .float-c { animation: floatC 8s ease-in-out infinite; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .bar-a { animation: barA 5s ease-in-out infinite; transform-origin: 811px 605px; }
      .bar-b { animation: barB 5s ease-in-out infinite; transform-origin: 859px 605px; }
      .bar-c { animation: barC 5s ease-in-out infinite; transform-origin: 907px 605px; }
      .bar-d { animation: barD 5s ease-in-out infinite; transform-origin: 955px 605px; }
      .cursor { animation: cursor 4s ease-in-out infinite; }
      .path-line { stroke-dasharray: 680; stroke-dashoffset: 680; animation: draw 6s ease-in-out infinite; }
      .chip-one { animation: chip 6s ease-in-out infinite; }
      .chip-two { animation: chip 6s ease-in-out infinite 0.4s; }
      .chip-three { animation: chip 6s ease-in-out infinite 0.8s; }
      @keyframes floatA { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
      @keyframes floatB { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(10px); } }
      @keyframes floatC { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
      @keyframes scan { 0%,100%{ transform: translateX(-80px); opacity:0; } 20%,70%{ opacity:0.75; } 50%{ transform: translateX(510px); } }
      @keyframes pulse { 0%,100%{ opacity:0.55; } 50%{ opacity:1; } }
      @keyframes barA { 0%,100%{ transform: scaleY(0.42); } 45%,70%{ transform: scaleY(0.86); } }
      @keyframes barB { 0%,100%{ transform: scaleY(0.68); } 45%,70%{ transform: scaleY(0.5); } }
      @keyframes barC { 0%,100%{ transform: scaleY(0.36); } 45%,70%{ transform: scaleY(0.76); } }
      @keyframes barD { 0%,100%{ transform: scaleY(0.58); } 45%,70%{ transform: scaleY(0.95); } }
      @keyframes cursor { 0%,18%{ transform: translate(0,0); } 38%{ transform: translate(180px,0); } 58%{ transform: translate(252px,120px); } 78%{ transform: translate(88px,242px); } 100%{ transform: translate(0,0); } }
      @keyframes draw { 0%{ stroke-dashoffset:680; opacity:0.2; } 20%,75%{ opacity:0.9; } 55%{ stroke-dashoffset:0; } 100%{ stroke-dashoffset:-680; opacity:0.1; } }
      @keyframes chip { 0%,100%{ opacity:0.48; } 35%,62%{ opacity:1; } }
      @media (prefers-reduced-motion: reduce) {
        .float-a, .float-b, .float-c, .scan, .pulse, .bar-a, .bar-b, .bar-c, .bar-d, .cursor, .path-line, .chip-one, .chip-two, .chip-three { animation: none; }
      }
    </style>
  </defs>
  <rect width="1440" height="820" rx="42" fill="url(#bg)"/>
  <rect width="1440" height="820" rx="42" fill="url(#grid)"/>
  <path class="path-line" d="M278 248 C420 178 565 212 663 315 C744 402 808 409 918 356 C1032 301 1128 333 1198 445" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path class="path-line" d="M297 580 C441 644 597 627 705 539 C796 465 872 468 957 520 C1036 568 1136 568 1210 505" stroke="#34d399" stroke-width="4" stroke-linecap="round" style="animation-delay:.7s"/>

  <g filter="url(#shadow)">
    <rect x="176" y="96" width="1088" height="628" rx="34" fill="url(#surface)"/>
    <rect x="176" y="96" width="1088" height="76" rx="34" fill="#e2e8f0"/>
    <rect x="176" y="140" width="1088" height="32" fill="#e2e8f0"/>
    <circle cx="224" cy="134" r="9" fill="#fb7185"/>
    <circle cx="255" cy="134" r="9" fill="#f59e0b"/>
    <circle cx="286" cy="134" r="9" fill="#22c55e"/>
    <rect x="347" y="118" width="334" height="32" rx="16" fill="#f8fafc"/>
    <text x="374" y="139" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">modtale.net/news/fresh-feature-showcase</text>
  </g>

  <g class="float-a">
    <rect x="232" y="216" width="408" height="424" rx="28" fill="url(#panel)"/>
    <text x="264" y="266" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">Discovery, tuned up</text>
    <text x="265" y="299" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Browse real Modtale project types in one flow.</text>
    <rect x="264" y="332" width="326" height="48" rx="16" fill="#0f172a" stroke="#334155"/>
    <rect class="scan" x="278" y="340" width="72" height="32" rx="12" fill="#38bdf8" opacity="0.55"/>
    <text x="292" y="362" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Search mods, plugins, worlds</text>
    <g class="chip-one">
      <rect x="264" y="410" width="86" height="34" rx="17" fill="url(#blue)"/>
      <text x="286" y="432" fill="white" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900">Mods</text>
    </g>
    <g class="chip-two">
      <rect x="360" y="410" width="106" height="34" rx="17" fill="#1e293b" stroke="#475569"/>
      <text x="385" y="432" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900">Plugins</text>
    </g>
    <g class="chip-three">
      <rect x="476" y="410" width="104" height="34" rx="17" fill="#1e293b" stroke="#475569"/>
      <text x="497" y="432" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900">Worlds</text>
    </g>
    <g>
      <rect x="264" y="475" width="148" height="122" rx="18" fill="#f8fafc"/>
      <rect x="280" y="492" width="52" height="52" rx="14" fill="url(#amber)"/>
      <text x="280" y="568" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Live project</text>
      <text x="280" y="589" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Real card data</text>
      <rect x="430" y="475" width="148" height="122" rx="18" fill="#f8fafc"/>
      <rect x="446" y="492" width="52" height="52" rx="14" fill="url(#green)"/>
      <text x="446" y="568" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Creator page</text>
      <text x="446" y="589" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Fresh update</text>
    </g>
  </g>

  <g class="float-b">
    <rect x="706" y="208" width="384" height="260" rx="28" fill="#ffffff"/>
    <rect x="736" y="238" width="104" height="104" rx="24" fill="url(#blue)"/>
    <text x="866" y="270" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">Project pages</text>
    <text x="866" y="302" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Gallery, wiki, changelog, and downloads.</text>
    <rect x="736" y="374" width="324" height="54" rx="18" fill="#ecfeff"/>
    <rect x="756" y="393" width="122" height="16" rx="8" fill="#0891b2"/>
    <rect x="902" y="393" width="52" height="16" rx="8" fill="#14b8a6"/>
    <rect x="978" y="393" width="52" height="16" rx="8" fill="#f59e0b"/>
    <g class="cursor">
      <path d="M760 252 L802 348 L777 342 L762 374 L746 367 L762 337 L737 327 Z" fill="#0f172a"/>
      <path d="M760 252 L802 348 L777 342 L762 374 L746 367 L762 337 L737 327 Z" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>

  <g class="float-c">
    <rect x="748" y="506" width="318" height="148" rx="28" fill="#0f172a"/>
    <text x="780" y="552" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">Creator analytics</text>
    <rect x="809" y="601" width="28" height="4" rx="2" fill="#38bdf8"/>
    <rect class="bar-a" x="809" y="566" width="28" height="39" rx="7" fill="#38bdf8"/>
    <rect class="bar-b" x="857" y="545" width="28" height="60" rx="7" fill="#34d399"/>
    <rect class="bar-c" x="905" y="575" width="28" height="30" rx="7" fill="#fbbf24"/>
    <rect class="bar-d" x="953" y="533" width="28" height="72" rx="7" fill="#fb7185"/>
    <text x="780" y="624" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Downloads and follows move with each release.</text>
  </g>

  <g class="pulse">
    <rect x="1102" y="308" width="154" height="92" rx="24" fill="#fff7ed"/>
    <text x="1130" y="349" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900">RSS</text>
    <text x="1130" y="375" fill="#c2410c" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Feed ready</text>
    <path d="M1132 325 C1161 325 1186 350 1186 379" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
    <path d="M1132 348 C1148 348 1163 363 1163 379" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1137" cy="379" r="7" fill="#f97316"/>
  </g>

  <text x="232" y="774" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">A freshly added-feeling update tour for players, creators, and embeds.</text>
</svg>
