    <circle cx="802" cy="178" r="8" fill="#f59e0b"/>
    <circle cx="830" cy="178" r="8" fill="#22c55e"/>
    <rect x="768" y="236" width="188" height="42" rx="14" fill="#0f172a"/>
    <text x="790" y="263" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">Search project types</text>
    <rect x="973" y="236" width="88" height="42" rx="14" fill="url(#blue)"/>
    <text x="996" y="263" fill="white" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900">Mods</text>
    <rect x="768" y="304" width="130" height="108" rx="20" fill="#dbeafe"/>
    <rect x="788" y="326" width="46" height="46" rx="14" fill="url(#amber)"/>
    <text x="788" y="394" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Live project</text>
    <rect x="922" y="304" width="130" height="108" rx="20" fill="#dcfce7"/>
    <rect x="942" y="326" width="46" height="46" rx="14" fill="url(#green)"/>
    <text x="942" y="394" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Creator page</text>
  </g>
  <g filter="url(#shadow)">
