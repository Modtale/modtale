  <text x="70" y="320" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900">Modtale Features</text>
  <text x="74" y="382" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Discovery, project pages, creator tools, embeds, and RSS in one visual tour.</text>
  <g transform="translate(70 442)">
    <rect width="136" height="44" rx="22" fill="#dbeafe"/>
    <text x="28" y="29" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">Browse</text>
    <rect x="152" width="160" height="44" rx="22" fill="#dcfce7"/>
