    <path d="M28 31 H60 V40 H42 V51 H57 V60 H28 V31Z" fill="white"/>
    <text x="112" y="34" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">Modtale News</text>
    <text x="112" y="66" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Product update showcase</text>
  </g>
