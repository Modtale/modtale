    <text x="846" y="454" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">Embeds ready</text>
    <text x="846" y="486" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Open Graph, Twitter cards, and RSS.</text>
