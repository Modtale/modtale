[package]
name = "modtale-bootstrap"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
fs2 = "0.4"
tempfile = "3"
tinyfiledialogs = "3.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"
